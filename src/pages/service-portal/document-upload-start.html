<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <title>Dokumente nachreichen</title>
  </head>
  <body>
    <main>
      <a href="/index.html">Zurück zur Startseite</a>

      <div class="welcome-section">
        <h1>Dokumente zu einem bestehenden Vorgang nachreichen</h1>
        <p>
          Geben Sie die E-Mail-Adresse an, welche Sie bei der Antragstellung
          verwendet haben, sowie die Vorgangsnummer.
        </p>
      </div>

      <form
        class="application-form document-upload-form"
        action="#"
        method="post"
      >
        <div class="form-group">
          <label for="email">E-Mail-Adresse</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="ihre.email@beispiel.de"
            required
          />
        </div>

        <div class="form-group">
          <label for="case-number">Vorgangsnummer</label>
          <input
            type="text"
            id="case-number"
            name="case-number"
            placeholder="z. B. VG-2026-001284"
            required
          />
        </div>

        <div class="form-actions">
          <button type="submit">Weiter</button>
        </div>

        <p class="form-hint">
          <span aria-hidden="true">ⓘ</span>
          Anschließend können Sie die für Ihren Vorgang benötigten Dokumente
          hochladen.
        </p>
      </form>
    </main>

    <script src="/src/scripts/main.ts" type="module"></script>
  </body>
</html>
